[package]
name = "amoled-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
png = "0.18"
base64 = "0.22"
tauri = { version = "2", default-features = false, optional = true }

axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "time", "sync"] }
tempfile = "3"
subtle = "2"
getrandom = "0.3"
url = "2"

[features]
default = []
tauri-commands = ["dep:tauri"]

[[bin]]
name = "amoled-api"
path = "src/bin/amoled-api.rs"

[[bin]]
name = "amoled-studio"
path = "src/bin/amoled-studio.rs"
